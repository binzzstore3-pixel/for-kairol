<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi Lucu 💕</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: white;
      font-size: 35px;
      text-shadow: 2px 3px 8px #ff4f81;
      animation: goyang 1.5s infinite;
    }

    .character {
      font-size: 100px;
      margin: 20px;
      animation: loncat 1.2s infinite;
    }

    .text {
      background: rgba(255,255,255,0.25);
      padding: 15px 25px;
      border-radius: 25px;
      color: white;
      font-size: 20px;
      backdrop-filter: blur(5px);
    }

    .heart {
      position: absolute;
      font-size: 30px;
      animation: naik 5s linear infinite;
      bottom: -50px;
    }

    .heart:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 30%;
      animation-delay: 1s;
    }

    .heart:nth-child(3) {
      left: 50%;
      animation-delay: 2s;
    }

    .heart:nth-child(4) {
      left: 70%;
      animation-delay: 3s;
    }

    .heart:nth-child(5) {
      left: 90%;
      animation-delay: 4s;
    }

    @keyframes loncat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-35px) rotate(10deg);
      }
    }

    @keyframes goyang {
      0%, 100% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(3deg);
      }
    }

    @keyframes naik {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) scale(1.5) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="heart">❤️</div>
  <div class="heart">💖</div>
  <div class="heart">💗</div>
  <div class="heart">💕</div>
  <div class="heart">💓</div>

  <div class="container">
    <h1>haiii khairaaaa </h1>

    <div class="character">
      🐻
    </div>

    <div class="text">
      i lopeeee yuuu🙄😏 ✨
    </div>
  </div>

</body>
</html>
